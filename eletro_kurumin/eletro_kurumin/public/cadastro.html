<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de usuário</title>
</head>
<body>
    <h1>Cadastro de usuário</h1>

    <form id="formCadastro">
        <p><label>Nome: <input type="text" id="nome" required></label></p>
        <p><label>E-mail: <input type="email" id="email" required></label></p>
        <p><label>Senha (mínimo 8 caracteres): <input type="password" id="senha" minlength="8" required></label></p>
        <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>
    <p><a href="index.html">Voltar ao login</a></p>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async function(event) {
            event.preventDefault();

            const resposta = await fetch('/auth/cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome: document.getElementById('nome').value,
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value
                })
            });

            const dados = await resposta.json();
            document.getElementById('mensagem').textContent = dados.mensagem;
        });
    </script>
</body>
</html>
